# Mentez — produção na VPS (Docker Compose)
# Variáveis em infra/.env (nunca no Git): veja infra/.env.exemplo
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
  app:
    build: ../app
    restart: unless-stopped
    env_file: .env
    environment:
      MENTEZ_DB_HOST: db
      MENTEZ_DB_PORT: "3306"
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=1G"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MENTEZ_DB_USER: ${MENTEZ_DB_USER}
      MENTEZ_DB_PASSWORD: ${MENTEZ_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12
volumes: {caddy_data: {}, caddy_config: {}, db_data: {}}
