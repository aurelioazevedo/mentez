# Atualização na VPS (projeto "mentez-update" no Docker Manager da Hostinger):
# 1) baixa o código do GitHub para /opt/mentez/src, com a deploy key só de leitura que fica na VPS;
# 2) monta a imagem do app (mentez-app:latest) no próprio servidor.
# Depois disso, publicar o projeto "mentez" (infra/vps.yml) troca o app pela versão nova.
services:
  update:
    image: docker:27-cli
    restart: "no"
    volumes:
      - /opt/mentez:/opt/mentez
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GIT_SSH_COMMAND: "ssh -i /opt/mentez/keys/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/opt/mentez/keys/known_hosts"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache git openssh-client >/dev/null
        if [ -d /opt/mentez/src/.git ]; then
          git -C /opt/mentez/src fetch --depth 1 origin main
          git -C /opt/mentez/src reset --hard origin/main
        else
          git clone --depth 1 --branch main git@github.com:aurelioazevedo/mentez.git /opt/mentez/src
        fi
        # chaves da Evolution (WhatsApp), geradas uma vez aqui no servidor; nunca passam pelo Git nem pela API
        if [ ! -f /opt/mentez/evolution.env ]; then
          K=$$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
          P=$$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          umask 077
          printf 'AUTHENTICATION_API_KEY=%s\nPOSTGRES_PASSWORD=%s\nDATABASE_CONNECTION_URI=postgresql://evolution:%s@evodb:5432/evolution?schema=public\n' "$$K" "$$P" "$$P" > /opt/mentez/evolution.env
          echo "EVOLUTION: chaves criadas"
        fi
        # par de chaves para trazer clínicas de outros servidores (a pública vai no código do sistema antigo; a privada fica aqui)
        # (pasta própria, legível pelo usuário do app; a pasta keys guarda a deploy key e fica só para o root)
        mkdir -p /opt/mentez/files /opt/mentez/migracao
        chown 1000:1000 /opt/mentez/files /opt/mentez/migracao
        chmod 700 /opt/mentez/migracao
        if [ -f /opt/mentez/keys/migracao.pem ] && [ ! -f /opt/mentez/migracao/migracao.pem ]; then cp /opt/mentez/keys/migracao.pem /opt/mentez/migracao/migracao.pem; fi
        if [ ! -f /opt/mentez/migracao/migracao.pem ]; then
          apk add --no-cache openssl >/dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /opt/mentez/migracao/migracao.pem 2>/dev/null
          echo "MIGRACAO: chaves criadas"
        fi
        chown 1000:1000 /opt/mentez/migracao/migracao.pem
        chmod 600 /opt/mentez/migracao/migracao.pem
        apk add --no-cache openssl >/dev/null
        echo "MIGRACAO-PUB: $$(openssl pkey -in /opt/mentez/migracao/migracao.pem -pubout | grep -v -- '-----' | tr -d '\n')"
        # arquivos próprios de clínicas que vêm no repositório (ex.: folhas de exercícios do Dr. Aurélio) → pasta de cada clínica
        if [ -d /opt/mentez/src/tenant-files ]; then
          cp -R /opt/mentez/src/tenant-files/. /opt/mentez/files/
          chown -R 1000:1000 /opt/mentez/files
          echo "ARQUIVOS: $$(find /opt/mentez/src/tenant-files -name '*.pdf' | wc -l) PDF(s) de clínicas copiados"
        fi
        REV=$$(git -C /opt/mentez/src log -1 --format='%h')
        echo "SYNC: $$REV $$(git -C /opt/mentez/src log -1 --format='%s')"
        docker build -q -t mentez-app:latest -t mentez-app:$$REV /opt/mentez/src/app
        echo "BUILD: ok mentez-app:$$REV"
        # Troca SÓ o contêiner do app (banco, WhatsApp e Caddy não são recriados). Antes, garante o banco ligado.
        docker compose version >/dev/null 2>&1 || apk add --no-cache docker-cli-compose >/dev/null
        for s in db evodb evolution caddy; do
          st=$$(docker inspect -f '{{.State.Status}}' mentez-$$s-1 2>/dev/null || echo ausente)
          if [ "$$st" != running ]; then echo "SERVICO: $$s estava $$st, ligando"; docker start mentez-$$s-1 >/dev/null || true; fi
        done
        docker compose -p mentez -f /opt/mentez/src/infra/vps.yml up -d --no-deps --no-build app
        for i in $$(seq 1 30); do h=$$(docker inspect -f '{{.State.Health.Status}}' mentez-app-1 2>/dev/null); [ "$$h" = healthy ] && break; sleep 2; done
        echo "APP: $$(docker inspect -f '{{.Config.Image}} {{.State.Health.Status}}' mentez-app-1)"
        for s in db evodb evolution caddy app; do echo "STATUS: $$s $$(docker inspect -f '{{.State.Status}}' mentez-$$s-1)"; done
        docker image prune -f >/dev/null || true
