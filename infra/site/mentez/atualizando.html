<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="6">
<meta name="robots" content="noindex">
<title>Atualizando · volta em instantes</title>
<style>
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 600px at 10% -10%,#DDF5F2,transparent 60%),radial-gradient(800px 600px at 110% 110%,#ECE7FD,transparent 60%),#F5F7FC;color:#0D2246;font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
main{width:min(440px,100%);background:#fff;border-radius:24px;padding:36px 28px 30px;box-shadow:0 30px 70px -40px rgba(7,25,54,.45);border:1px solid rgba(7,25,54,.06)}
.sp{width:58px;height:58px;margin:0 auto 20px;border-radius:50%;border:5px solid #DDF5F2;border-top-color:#07C6BC;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{margin:0 0 8px;font-size:23px;letter-spacing:-.02em}
p{margin:0 0 6px;color:#4F5E74}
a{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:999px;background:#071936;color:#fff;font-weight:700;text-decoration:none}
small{display:block;margin-top:16px;color:#7A879B;font-size:13px}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
@media (prefers-color-scheme:dark){body{background:#0B1220;color:#EDF1F5}main{background:#141C2B;border-color:rgba(255,255,255,.08)}p{color:#AAB4C0}.sp{border-color:#1E2B3F;border-top-color:#07C6BC}a{background:#07C6BC;color:#071936}}
</style>
</head>
<body><main>
<div class="sp" aria-hidden="true"></div>
<h1>Estamos atualizando o sistema</h1>
<p>Uma melhoria está sendo instalada agora. Leva só alguns segundos.</p>
<p>Nada do que você salvou foi perdido.</p>
<a href="">Tentar de novo</a>
<small>Esta página recarrega sozinha.</small>
</main></body></html>
