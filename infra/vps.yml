# Mentez — produção na VPS (projeto "mentez" no Docker Manager da Hostinger).
# Usa o código e a imagem preparados por infra/vps-update.yml (/opt/mentez/src, mentez-app:latest) e os segredos em /opt/mentez/.env,
# gerados na própria VPS (nunca passam pelo Git nem pela API).
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - /opt/mentez/src/infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mentez/src/infra/site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
  app:
    image: mentez-app:latest   # montada na VPS por infra/vps-update.yml
    pull_policy: never
    restart: unless-stopped
    env_file: /opt/mentez/.env
    environment:
      MENTEZ_DB_HOST: db
      MENTEZ_DB_PORT: "3306"
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: /opt/mentez/.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=1G"]
    volumes:
      - db_data:/var/lib/mysql
      - /opt/mentez/src/infra/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      retries: 12
volumes: {caddy_data: {}, caddy_config: {}, db_data: {}}
